<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Marco's Pizzeria — Order Online</title>
<meta name="theme-color" content="#007830" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;} 
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#007830;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .card{max-width:380px;}
  img{width:120px;height:120px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:34px;margin:22px 0 6px;}
  .tag{color:#d7f0df;font-size:15px;margin-bottom:26px;}
  .btn{display:inline-block;background:#fff;color:#007830;font-weight:700;padding:14px 26px;border-radius:9999px;text-decoration:none;}
  .accent{height:5px;width:70px;background:#C01818;border-radius:9999px;margin:18px auto 0;}
  .small{margin-top:22px;font-size:12px;color:#bfe3c9;}
</style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-512.png" alt="Marco's Pizzeria" />
    <h1>Marco's Pizzeria</h1>
    <p class="tag">Fresh pizza for collection &amp; delivery</p>
    <a class="btn" href="/">Start your order</a>
    <div class="accent"></div>
    <p class="small">Installable app shell · Marco's Pizzeria</p>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
